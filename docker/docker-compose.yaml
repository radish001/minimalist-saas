services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "13306:3306"
    healthcheck:
      test: [ "CMD-SHELL", "echo SELECT 1 | mysql -uroot -proot -h127.0.0.1 -P3306" ]
      start_period: 30s
      start_interval: 1s
      interval: 10s
      retries: 3
  redis:
    image: redis:7.4.4-alpine3.21
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      start_period: 10s
      start_interval: 5s
      interval: 10s
      retries: 3


  init-tables:
    image: mysql:8.4
    command: /docker/init-tables.sh
    volumes:
      - config:/config
      - ./init-tables.sh:/docker/init-tables.sh
      - ./init-tables.sql:/docker/init-tables.sql
      - ../resources/sql/mysql:/docker/sql-scripts
    depends_on:
        mysql:
          condition: service_healthy

volumes:
  config:
